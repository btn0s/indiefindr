<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.5 var(--font-sans,Inter,system-ui,sans-serif);background:var(--color-background-primary,#f7f7f9);color:var(--color-text-primary,#17171b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:start;justify-content:space-between;gap:24px}h1{margin:0;font-size:24px;line-height:1.2;font-weight:650;letter-spacing:-.025em;text-wrap:balance}#status{margin:6px 0 20px;color:var(--color-text-secondary,#696975);font-variant-numeric:tabular-nums}
nav{display:flex;gap:8px}
button{display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:8px;color:inherit;cursor:pointer;background:#fff;box-shadow:0 0 0 1px rgb(19 19 22/.12);transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 200ms ease,opacity 200ms ease}
@media(hover:hover) and (pointer:fine){button:hover{background:#f4f4f6}}button:active{transform:scale(.97);background:#ededf0;transition-duration:100ms}button:disabled{opacity:.4;cursor:default;transform:none}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}:focus:not(:focus-visible){outline:none}
#games{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;padding:4px 4px 14px;margin:-4px -4px 0;scroll-padding-inline:4px;scrollbar-width:thin;scrollbar-color:rgb(19 19 22/.18) transparent;border-radius:12px}
.game{flex:0 0 250px;scroll-snap-align:start;color:inherit;text-decoration:none;border-radius:8px}.game:focus-visible{outline-offset:4px}
.art{position:relative;overflow:hidden;aspect-ratio:460/215;border-radius:8px;background:var(--color-background-secondary,#e5e5ec);transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.art img{display:block;width:100%;height:100%;object-fit:cover}
@media(hover:hover) and (pointer:fine){.game:hover h2{text-decoration:underline;text-underline-offset:3px}}
.game:active .art{transform:scale(.97);transition-duration:100ms}
.game h2{margin:10px 0 2px;font-size:15px;line-height:1.4;font-weight:500}.game p{margin:0;font-size:13px;color:var(--color-text-secondary,#696975)}.game strong{color:var(--color-text-primary,#17171b);font-weight:600;font-variant-numeric:tabular-nums}
footer{margin-top:12px;color:var(--color-text-secondary,#696975);font-size:12px}
@media(max-width:500px){body{padding:16px}h1{font-size:20px}.game{flex-basis:230px}}
@media(prefers-reduced-motion:reduce){*{transition-duration:0s!important}}
</style></head><body><header><div><h1>Indie games to play next</h1><p id="status" role="status">Loading recommendations…</p></div><nav aria-label="Browse recommendations"><button id="previous" aria-label="Previous games" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button id="next" aria-label="Next games"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></nav></header><main id="games" aria-label="Recommended games" tabindex="0"></main><footer>Ratings and artwork from Steam. Powered by indiefindr.</footer><script>__APP_SCRIPT__</script></body></html>
